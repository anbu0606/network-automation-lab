frr version 10.0_git
frr defaults traditional
hostname r1
domainname localdomain
no ipv6 forwarding
!
interface eth1
 bandwidth 100
 description to-r3
 ip address 20.238.142.1/24
exit
!
interface eth2
 bandwidth 100
 description to-r4
 ip address 20.238.149.1/24
exit
!
interface eth3
 bandwidth 1000
 description to-r2
 ip address 20.238.10.1/24
exit
!
interface eth4
 description clients-lan
 ip address 20.238.131.1/24
 ip ospf passive
exit
!
router ospf
 ospf router-id 1.1.1.1
 auto-cost reference-bandwidth 10000
 network 20.238.0.0/16 area 0
exit
!
