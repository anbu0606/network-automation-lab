frr version 10.0_git
frr defaults traditional
hostname r3
domainname localdomain
no ipv6 forwarding
!
interface eth1
 bandwidth 100
 description to-r1
 ip address 20.238.142.2/24
exit
!
interface eth2
 bandwidth 1000
 description to-r2
 ip address 20.238.209.1/24
exit
!
interface eth3
 description dmz
 ip address 20.238.155.1/24
 ip ospf passive
exit
!
interface eth4
 description to-internet
 ip address 135.180.199.1/24
!
interface eth5
 description to-minerva-direct
 ip address 203.0.113.1/30
!
ip route 20.238.0.0/16 blackhole
!
router ospf
 ospf router-id 3.3.3.3
 auto-cost reference-bandwidth 10000
 network 20.238.0.0/16 area 0
 default-information originate always
exit
!
!
router bgp 65100
 bgp router-id 3.3.3.3
 no bgp ebgp-requires-policy
 neighbor 135.180.199.2 remote-as 65000
 neighbor 135.180.199.2 description internet
 !
 address-family ipv4 unicast
  network 20.238.0.0/16
 exit-address-family
!
