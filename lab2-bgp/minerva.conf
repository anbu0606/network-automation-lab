frr defaults traditional
hostname minerva
!
interface eth1
 description to-internet
 ip address 177.47.116.2/24
!
interface eth2
 description delos-clients
 ip address 167.89.219.1/24
!
interface eth3
 description to-talos-r3-direct
 ip address 203.0.113.2/30
!
ip route 167.89.0.0/16 blackhole
!
router bgp 65200
 bgp router-id 5.5.5.5
 no bgp ebgp-requires-policy
 neighbor 177.47.116.1 remote-as 65000
 !
 address-family ipv4 unicast
  network 167.89.0.0/16
 exit-address-family
!
