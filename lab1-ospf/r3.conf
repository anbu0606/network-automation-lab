frr defaults traditional
hostname r3
!
interface eth1
 description to-r1
 ip address 20.238.142.2/24
 bandwidth 100
!
interface eth2
 description to-r2
 ip address 20.238.209.1/24
 bandwidth 1000
!
interface eth3
 description dmz
 ip address 20.238.155.1/24
!
router ospf
 ospf router-id 3.3.3.3
 auto-cost reference-bandwidth 10000
 network 20.238.0.0/16 area 0
 passive-interface eth3
!
