frr defaults traditional
hostname r4
!
interface eth1
 description to-r2
 ip address 20.238.172.1/24
 bandwidth 1000
!
interface eth2
 description to-r1
 ip address 20.238.149.2/24
 bandwidth 100
!
interface eth3
 description ssh-lan
 ip address 20.238.232.1/24
!
router ospf
 ospf router-id 4.4.4.4
 auto-cost reference-bandwidth 10000
 network 20.238.0.0/16 area 0
 passive-interface eth3
!
