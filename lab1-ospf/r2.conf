frr defaults traditional
hostname r2
!
interface eth1
 description to-r3
 ip address 20.238.209.2/24
 bandwidth 1000
!
interface eth2
 description to-r4
 ip address 20.238.172.2/24
 bandwidth 1000
!
interface eth3
 description to-r1
 ip address 20.238.10.2/24
 bandwidth 1000
!
interface eth4
 description intranet-lan
 ip address 20.238.124.1/24
!
router ospf
 ospf router-id 2.2.2.2
 auto-cost reference-bandwidth 10000
 network 20.238.0.0/16 area 0
 passive-interface eth4
!
