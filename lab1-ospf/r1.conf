frr defaults traditional
hostname r1
!
interface eth1
 description to-r3
 ip address 20.238.142.1/24
 bandwidth 100
!
interface eth2
 description to-r4
 ip address 20.238.149.1/24
 bandwidth 100
!
interface eth3
 description to-r2
 ip address 20.238.10.1/24
 bandwidth 1000
!
interface eth4
 description clients-lan
 ip address 20.238.131.1/24
!
router ospf
 ospf router-id 1.1.1.1
 auto-cost reference-bandwidth 10000
 network 20.238.0.0/16 area 0
 passive-interface eth4
!
